---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hami-ascend
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "update", "watch", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hami-ascend
subjects:
  - kind: ServiceAccount
    name: hami-ascend
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: hami-ascend
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hami-ascend
  namespace: kube-system
  labels:
    app.kubernetes.io/component: "hami-ascend"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hami-ascend-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/component: hami-ascend-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: hami-ascend-device-plugin
      hami.io/webhook: ignore
  template:
    metadata:
      labels:
        app.kubernetes.io/component: hami-ascend-device-plugin
        hami.io/webhook: ignore
    spec:
      priorityClassName: "system-node-critical"
      serviceAccountName: hami-ascend
      initContainers:
        - name: install-beagle-npu-smi
          image: registry.cn-qingdao.aliyuncs.com/wod/hami:v2.6.5-cann
          volumeMounts:
            - name: host-beagle-smi
              mountPath: /host-beagle-smi
            - name: host-sbin
              mountPath: /host-sbin
          command: ["/bin/sh", "-c"]
          args:
            - |
              # 独立命令模式：只安装 beagle-npu-smi，不覆盖原生 npu-smi
              mkdir -p /host-beagle-smi
              # 若历史版本曾覆盖过 npu-smi，从备份恢复原生命令
              if [ -f /host-beagle-smi/npu-smi.real ]; then
                cp /host-beagle-smi/npu-smi.real /host-sbin/npu-smi
                chmod +x /host-sbin/npu-smi
              elif [ -f /host-sbin/npu-smi ] && [ ! -f /host-beagle-smi/npu-smi.real ]; then
                # 可选备份，便于回滚排查；查询仍走原生 /usr/local/sbin/npu-smi
                cp /host-sbin/npu-smi /host-beagle-smi/npu-smi.real
                chmod +x /host-beagle-smi/npu-smi.real
              fi
              SRC=/usr/local/bin/beagle-npu-smi
              if [ ! -f "$SRC" ] && [ -f /usr/local/bin/beagle-smi-npu ]; then
                SRC=/usr/local/bin/beagle-smi-npu
              fi
              cp "$SRC" /host-beagle-smi/beagle-npu-smi
              chmod +x /host-beagle-smi/beagle-npu-smi
              cp "$SRC" /host-sbin/beagle-npu-smi
              chmod +x /host-sbin/beagle-npu-smi
              # 清理旧版残留（覆盖 npu-smi / 旧命令名）
              rm -f /host-beagle-smi/npu-smi /host-beagle-smi/beagle-smi-npu /host-sbin/beagle-smi-npu
              echo "beagle-npu-smi installed as independent command; npu-smi untouched"
      containers:
        - image: registry.cn-qingdao.aliyuncs.com/wod/hami:v2.6.5-cann
          imagePullPolicy: IfNotPresent
          name: device-plugin
          resources:
            requests:
              memory: 500Mi
              cpu: 500m
            limits:
              memory: 500Mi
              cpu: 500m
          args:
            - --config_file
            - /device-config.yaml
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: pod-resource
              mountPath: /var/lib/kubelet/pod-resources
            - name: hiai-driver
              mountPath: /usr/local/Ascend/driver
              readOnly: true
            - name: log-path
              mountPath: /var/log/mindx-dl/devicePlugin
            - name: tmp
              mountPath: /tmp
            - name: ascend-config
              mountPath: /device-config.yaml
              subPath: device-config.yaml
              readOnly: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: pod-resource
          hostPath:
            path: /var/lib/kubelet/pod-resources
        - name: hiai-driver
          hostPath:
            path: /usr/local/Ascend/driver
        - name: log-path
          hostPath:
            path: /var/log/mindx-dl/devicePlugin
            type: Directory
        - name: tmp
          hostPath:
            path: /tmp
        - name: ascend-config
          configMap:
            name: hami-scheduler-device
        - name: host-sbin
          hostPath:
            path: /usr/local/sbin
        - name: host-beagle-smi
          hostPath:
            path: /opt/beagle-smi
            type: DirectoryOrCreate
      nodeSelector:
        ascend: "on"

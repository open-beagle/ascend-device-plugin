kind: pipeline
name: dev

trigger:
  branch:
    - dev

volumes:
  - name: docker
    host:
      path: /var/run/docker.sock

clone:
  disable: true

steps:
  - name: fetch
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/devops-git:1.0
    settings:
      proxy:
        from_secret: SOCKS5_PROXY

  - name: build
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/golang:1.25
    environment:
      BUILD_VERSION: v1.2.0-beagle
    commands:
      - sh .beagle/build.sh

  - name: docker-arm64
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/devops-docker:1.0
    volumes:
      - name: docker
        path: /var/run/docker.sock
    settings:
      base: registry-vpc.cn-qingdao.aliyuncs.com/wod/ubuntu:22.04-arm64
      dockerfile: .beagle/dockerfile
      repo: wod/ascend-device-plugin
      Version: "v1.2.0" # 请在这里调整最终的版本号
      channel: arm64
      args: "TARGETOS=linux,TARGETARCH=arm64"
      registry: registry-vpc.cn-qingdao.aliyuncs.com
      registry_user:
        from_secret: REGISTRY_USER_ALIYUN
      registry_password:
        from_secret: REGISTRY_PASSWORD_ALIYUN

---
kind: pipeline
name: main

trigger:
  branch:
    - main

clone:
  disable: true

steps:
  - name: harbor
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/devops-docker-tag:1.0
    environment:
      REGISTRY_USER:
        from_secret: REGISTRY_USER_ALIYUN
      REGISTRY_PASSWORD:
        from_secret: REGISTRY_PASSWORD_ALIYUN
    settings:
      source: registry-vpc.cn-qingdao.aliyuncs.com/wod/ascend-device-plugin:v1.2.0-arm64
      target: registry-vpc.cn-qingdao.aliyuncs.com/wod/ascend-device-plugin:v1.2.0
      registry: registry-vpc.cn-qingdao.aliyuncs.com

---
kind: secret
name: SOCKS5_PROXY
get:
  name: SOCKS5_PROXY
  path: devops-secrets

---
kind: secret
name: REGISTRY_USER_ALIYUN
get:
  name: REGISTRY_USER_ALIYUN
  path: devops-secrets

---
kind: secret
name: REGISTRY_PASSWORD_ALIYUN
get:
  name: REGISTRY_PASSWORD_ALIYUN
  path: devops-secrets

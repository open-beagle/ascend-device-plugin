<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2200" font-family="'Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1100" height="2200" fill="url(#bg)" rx="8"/>

  <!-- 标题 -->
  <text x="550" y="45" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">ascend-device-plugin 部署流程图</text>
  <line x1="200" y1="58" x2="900" y2="58" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ==================== 阶段一：beagle-smi-npu 编译 ==================== -->
  <text x="50" y="95" font-size="16" font-weight="bold" fill="#1e40af">阶段一：beagle-smi-npu 编译</text>

  <!-- beagle-smi-npu 项目框 -->
  <rect x="50" y="110" width="460" height="200" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="138" font-size="14" font-weight="bold" fill="#1e40af">📁 beagle-smi-npu/ (子模块)</text>
  <text x="70" y="162" fill="#334155">├── cmd/app/              # 程序入口</text>
  <text x="70" y="182" fill="#334155">├── internal/             # 核心逻辑</text>
  <text x="70" y="202" fill="#334155">├── scripts/build.sh      # 编译脚本</text>
  <text x="70" y="222" fill="#334155">└── dist/</text>
  <text x="70" y="242" fill="#334155">    ├── beagle-smi-npu-linux-arm64</text>
  <text x="70" y="262" fill="#334155">    └── beagle-smi-npu-linux-amd64</text>

  <!-- 编译命令框 -->
  <rect x="570" y="110" width="470" height="80" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="138" font-size="14" font-weight="bold" fill="#166534">⚙️ 编译命令</text>
  <text x="590" y="162" fill="#334155" font-family="monospace" font-size="12">cd beagle-smi-npu</text>
  <text x="590" y="182" fill="#334155" font-family="monospace" font-size="12">bash scripts/build.sh</text>

  <!-- 编译产物框 -->
  <rect x="570" y="210" width="470" height="100" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="238" font-size="14" font-weight="bold" fill="#854d0e">📦 编译产物</text>
  <text x="590" y="262" fill="#334155" font-family="monospace" font-size="12">beagle-smi-npu/dist/beagle-smi-npu-linux-arm64</text>
  <text x="590" y="282" fill="#334155" font-family="monospace" font-size="12">beagle-smi-npu/dist/beagle-smi-npu-linux-amd64</text>

  <!-- 箭头：项目 → 编译 -->
  <line x1="510" y1="150" x2="565" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== 阶段二：二进制拷贝 ==================== -->
  <text x="50" y="360" font-size="16" font-weight="bold" fill="#1e40af">阶段二：拷贝二进制到 ascend-device-plugin</text>

  <!-- 拷贝命令框 -->
  <rect x="200" y="380" width="700" height="70" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="408" font-size="14" font-weight="bold" fill="#991b1b">📋 手动拷贝命令</text>
  <text x="220" y="432" fill="#334155" font-family="monospace" font-size="12">cp beagle-smi-npu/dist/beagle-smi-npu-linux-arm64  ascend-device-plugin/dist/beagle-smi-npu</text>

  <!-- 箭头：编译产物 → 拷贝 -->
  <path d="M 805 310 L 805 340 Q 805 350 795 350 L 560 350 Q 550 350 550 360 L 550 375" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- 目标位置框 -->
  <rect x="300" y="475" width="500" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="503" font-size="14" font-weight="bold" fill="#1e40af">📁 ascend-device-plugin/dist/</text>
  <text x="320" y="527" fill="#334155" font-family="monospace" font-size="13">└── beagle-smi-npu    ← 预置的 arm64 二进制</text>

  <!-- 箭头：拷贝 → 目标 -->
  <line x1="550" y1="450" x2="550" y2="470" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== 阶段三：CI 构建 & 镜像打包 ==================== -->
  <text x="50" y="600" font-size="16" font-weight="bold" fill="#1e40af">阶段三：CI 构建 &amp; Docker 镜像打包 (推送 dev 分支自动触发)</text>

  <!-- build.sh 框 -->
  <rect x="50" y="620" width="480" height="180" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="648" font-size="14" font-weight="bold" fill="#166534">⚙️ .beagle/build.sh</text>
  <text x="70" y="672" fill="#334155">1. 安装 ARM64 交叉编译链</text>
  <text x="70" y="692" fill="#334155">2. go build → 编译 ascend-device-plugin 二进制</text>
  <text x="70" y="712" fill="#334155">3. cp ./dist/beagle-smi-npu ./beagle-smi-npu</text>
  <text x="85" y="732" fill="#64748b" font-size="12">(将预置二进制拷贝到构建根目录)</text>
  <text x="70" y="758" font-weight="bold" fill="#166534">产物: ./ascend-device-plugin + ./beagle-smi-npu</text>

  <!-- Dockerfile 框 -->
  <rect x="570" y="620" width="480" height="180" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="648" font-size="14" font-weight="bold" fill="#7e22ce">🐳 .beagle/dockerfile</text>
  <text x="590" y="672" fill="#334155" font-family="monospace" font-size="12">FROM ubuntu:22.04</text>
  <text x="590" y="696" fill="#334155" font-family="monospace" font-size="12">COPY ascend-device-plugin</text>
  <text x="590" y="716" fill="#334155" font-family="monospace" font-size="12">  → /usr/local/bin/ascend-device-plugin</text>
  <text x="590" y="740" fill="#334155" font-family="monospace" font-size="12">COPY beagle-smi-npu</text>
  <text x="590" y="760" fill="#334155" font-family="monospace" font-size="12">  → /usr/local/bin/beagle-smi-npu</text>

  <!-- 镜像产物框 -->
  <rect x="570" y="820" width="480" height="60" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="848" font-size="13" font-weight="bold" fill="#854d0e">📦 镜像: registry.cn-qingdao.aliyuncs.com/wod/ascend-device-plugin:v1.2.0-smi-arm64</text>

  <!-- 箭头：build → dockerfile -->
  <line x1="530" y1="710" x2="565" y2="710" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 箭头：dockerfile → 镜像 -->
  <line x1="810" y1="800" x2="810" y2="815" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== 阶段四：K8s 部署 ==================== -->
  <text x="50" y="930" font-size="16" font-weight="bold" fill="#1e40af">阶段四：K8s 部署 (ascend-device-plugin.yaml)</text>

  <!-- YAML 文件说明框 -->
  <rect x="50" y="950" width="500" height="170" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="978" font-size="14" font-weight="bold" fill="#c2410c">📄 ascend-device-plugin.yaml</text>
  <text x="70" y="1002" fill="#334155">项目中位置:</text>
  <text x="70" y="1022" fill="#334155" font-family="monospace" font-size="12">  ascend-device-plugin/ascend-device-plugin.yaml</text>
  <text x="70" y="1050" fill="#334155">部署命令 (在有 kubectl 权限的机器上执行):</text>
  <text x="70" y="1070" fill="#334155" font-family="monospace" font-size="12">  kubectl apply -f ascend-device-plugin.yaml</text>
  <text x="70" y="1098" fill="#64748b" font-size="12">⚠️ 无需放到服务器固定位置，kubectl apply 提交给 API Server 即可</text>

  <!-- YAML 创建的资源框 -->
  <rect x="600" y="950" width="450" height="170" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="620" y="978" font-size="14" font-weight="bold" fill="#1e40af">🔧 创建的 K8s 资源</text>
  <text x="620" y="1002" fill="#334155">✅ ClusterRole: hami-ascend</text>
  <text x="620" y="1022" fill="#334155">✅ ClusterRoleBinding: hami-ascend</text>
  <text x="620" y="1042" fill="#334155">✅ ServiceAccount: hami-ascend</text>
  <text x="620" y="1062" fill="#334155">✅ DaemonSet: hami-ascend-device-plugin</text>
  <text x="635" y="1082" fill="#64748b" font-size="12">namespace: kube-system</text>
  <text x="635" y="1102" fill="#64748b" font-size="12">nodeSelector: ascend="on"</text>

  <!-- 箭头：YAML → 资源 -->
  <line x1="550" y1="1035" x2="595" y2="1035" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== 阶段五：DaemonSet 节点运行 ==================== -->
  <text x="50" y="1175" font-size="16" font-weight="bold" fill="#1e40af">阶段五：DaemonSet 在节点上的运行流程</text>

  <!-- 节点大框 -->
  <rect x="50" y="1195" width="1000" height="520" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="70" y="1225" font-size="15" font-weight="bold" fill="#475569">🖥️ K8s 节点 (带 ascend="on" 标签)</text>

  <!-- Pod 框 -->
  <rect x="80" y="1240" width="940" height="450" rx="10" fill="white" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="1268" font-size="14" font-weight="bold" fill="#334155">Pod: hami-ascend-device-plugin (kube-system)</text>

  <!-- initContainer 框 -->
  <rect x="110" y="1285" width="890" height="195" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="1313" font-size="14" font-weight="bold" fill="#1e40af">Step 1: initContainer (install-beagle-smi-npu)</text>

  <text x="130" y="1340" fill="#334155">1️⃣ mkdir -p /opt/beagle-smi (宿主机)</text>
  <text x="130" y="1365" fill="#334155">2️⃣ 备份原始 npu-smi (仅首次):</text>
  <text x="155" y="1385" fill="#334155" font-family="monospace" font-size="12">cp /usr/local/sbin/npu-smi → /opt/beagle-smi/npu-smi.real</text>
  <text x="130" y="1410" fill="#334155">3️⃣ 安装 beagle-smi-npu 到宿主机:</text>
  <text x="155" y="1430" fill="#334155" font-family="monospace" font-size="12">镜像 /usr/local/bin/beagle-smi-npu → /opt/beagle-smi/npu-smi</text>
  <text x="155" y="1450" fill="#334155" font-family="monospace" font-size="12">镜像 /usr/local/bin/beagle-smi-npu → /usr/local/sbin/npu-smi (替换原始)</text>

  <!-- 箭头：init → main -->
  <line x1="555" y1="1480" x2="555" y2="1500" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 主容器框 -->
  <rect x="110" y="1505" width="890" height="160" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="130" y="1533" font-size="14" font-weight="bold" fill="#166534">Step 2: 主容器 (device-plugin)</text>

  <text x="130" y="1558" fill="#334155">1️⃣ 注册 Device Plugin 到 kubelet</text>
  <text x="130" y="1583" fill="#334155">2️⃣ Allocate 时自动注入到用户 Pod:</text>
  <text x="155" y="1605" fill="#334155" font-family="monospace" font-size="12">env: huawei.com/Ascend910B2-memory = limits 中的值</text>
  <text x="155" y="1625" fill="#334155" font-family="monospace" font-size="12">env: REAL_NPU_SMI_PATH = /opt/beagle-smi/npu-smi.real</text>
  <text x="155" y="1645" fill="#334155" font-family="monospace" font-size="12">mount: /opt/beagle-smi (hostPath)</text>

  <!-- ==================== 阶段六：宿主机文件结构 ==================== -->
  <text x="50" y="1770" font-size="16" font-weight="bold" fill="#1e40af">阶段六：部署后宿主机文件结构</text>

  <rect x="50" y="1790" width="500" height="150" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="1818" font-size="14" font-weight="bold" fill="#854d0e">📂 /opt/beagle-smi/ (专用目录)</text>
  <text x="70" y="1845" fill="#334155" font-family="monospace" font-size="13">├── npu-smi       ← beagle-smi-npu (替换版)</text>
  <text x="70" y="1870" fill="#334155" font-family="monospace" font-size="13">└── npu-smi.real  ← 原始 npu-smi (备份)</text>
  <text x="70" y="1900" font-size="14" font-weight="bold" fill="#854d0e">📂 /usr/local/sbin/</text>
  <text x="70" y="1925" fill="#334155" font-family="monospace" font-size="13">└── npu-smi       ← beagle-smi-npu (全局替换)</text>

  <!-- ==================== 路径汇总表 ==================== -->
  <text x="50" y="1990" font-size="16" font-weight="bold" fill="#1e40af">完整路径汇总</text>

  <!-- 表头 -->
  <rect x="50" y="2005" width="1000" height="30" rx="4" fill="#1e40af"/>
  <text x="70" y="2025" fill="white" font-weight="bold" font-size="12">阶段</text>
  <text x="250" y="2025" fill="white" font-weight="bold" font-size="12">文件</text>
  <text x="500" y="2025" fill="white" font-weight="bold" font-size="12">路径</text>

  <!-- 表格行 -->
  <rect x="50" y="2035" width="1000" height="28" fill="#f1f5f9"/>
  <text x="70" y="2054" fill="#334155" font-size="12">beagle-smi-npu 编译</text>
  <text x="250" y="2054" fill="#334155" font-size="12">arm64 二进制</text>
  <text x="500" y="2054" fill="#334155" font-family="monospace" font-size="11">beagle-smi-npu/dist/beagle-smi-npu-linux-arm64</text>

  <rect x="50" y="2063" width="1000" height="28" fill="white"/>
  <text x="70" y="2082" fill="#334155" font-size="12">拷贝到 device-plugin</text>
  <text x="250" y="2082" fill="#334155" font-size="12">预置二进制</text>
  <text x="500" y="2082" fill="#334155" font-family="monospace" font-size="11">ascend-device-plugin/dist/beagle-smi-npu</text>

  <rect x="50" y="2091" width="1000" height="28" fill="#f1f5f9"/>
  <text x="70" y="2110" fill="#334155" font-size="12">Docker 镜像内</text>
  <text x="250" y="2110" fill="#334155" font-size="12">主程序</text>
  <text x="500" y="2110" fill="#334155" font-family="monospace" font-size="11">/usr/local/bin/ascend-device-plugin</text>

  <rect x="50" y="2119" width="1000" height="28" fill="white"/>
  <text x="70" y="2138" fill="#334155" font-size="12">Docker 镜像内</text>
  <text x="250" y="2138" fill="#334155" font-size="12">SMI 工具</text>
  <text x="500" y="2138" fill="#334155" font-family="monospace" font-size="11">/usr/local/bin/beagle-smi-npu</text>

  <rect x="50" y="2147" width="1000" height="28" fill="#f1f5f9"/>
  <text x="70" y="2166" fill="#334155" font-size="12">宿主机</text>
  <text x="250" y="2166" fill="#334155" font-size="12">beagle-smi-npu</text>
  <text x="500" y="2166" fill="#334155" font-family="monospace" font-size="11">/opt/beagle-smi/npu-smi + /usr/local/sbin/npu-smi</text>

  <rect x="50" y="2175" width="1000" height="1" fill="#cbd5e1"/>
</svg>
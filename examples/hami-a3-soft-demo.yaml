# HAMi Ascend910A3 soft-split demo (hami-core).
# Cluster: pingao / namespace beagle-gpu / node 10.3.40.166
# Requires: hami-scheduler + ascend-device-plugin with injectPackageSibling (default on).
# Apply:
#   kubectl --context pingao apply -f hami-a3-soft-demo.yaml
# Verify (quota view via independent CLI; native npu-smi remains full-card):
#   kubectl --context pingao -n beagle-gpu exec -it hami-a3-soft-demo -- beagle-npu-smi info
#   kubectl --context pingao -n beagle-gpu exec -it hami-a3-soft-demo -- npu-smi info
apiVersion: v1
kind: Pod
metadata:
  name: hami-a3-soft-demo
  namespace: beagle-gpu
  annotations:
    huawei.com/vnpu-mode: hami-core
spec:
  restartPolicy: Always
  schedulerName: hami-scheduler
  nodeSelector:
    kubernetes.io/hostname: "10.3.40.166"
  containers:
    - name: main
      image: registry.cn-qingdao.aliyuncs.com/wod/cann:6.2-py310-torch111
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      resources:
        requests:
          huawei.com/Ascend910A3: "1"
          huawei.com/Ascend910A3-core: "40"
          huawei.com/Ascend910A3-memory: "20480"
        limits:
          huawei.com/Ascend910A3: "1"
          huawei.com/Ascend910A3-core: "40"
          huawei.com/Ascend910A3-memory: "20480"
